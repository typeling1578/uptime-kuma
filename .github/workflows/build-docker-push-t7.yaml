name: Build docker Image and Push (t7)

on:
  push:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (slim)
        uses: docker/build-push-action@v4
        with:
          file: docker/dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/typeling1578/uptime-kuma:slim
          target: nightly
          build-args: |
            BASE_IMAGE=louislam/uptime-kuma:base2-slim

      - name: Build and push (slim-rootless)
        uses: docker/build-push-action@v4
        with:
          file: docker/dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/typeling1578/uptime-kuma:slim-rootless
          target: nightly-rootless
          build-args: |
            BASE_IMAGE=louislam/uptime-kuma:base2-slim
